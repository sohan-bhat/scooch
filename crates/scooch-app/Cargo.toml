[package]
name = "scooch-app"
description = "The Scooch window."
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/sohan-bhat/scooch"
authors = ["Sohan Bhat"]
publish = false
default-run = "scooch-app"

[workspace]

[[bin]]
name = "scooch-app"
path = "src/main.rs"

[features]
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scooch = { path = "../scooch" }
anyhow = "1"
dirs = "6"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(not(windows))'.dependencies]
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSWorkspace"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
glib = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
