[package]
name = "scooch"
description = "Wallpaper that scooches over for your desktop icons."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "scooch"
path = "src/main.rs"

[dependencies]
scooch-core = { path = "../scooch-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
