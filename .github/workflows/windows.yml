name: windows

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025, windows-2022]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p scooch --bins --examples

      - name: Test
        run: cargo test --release -p scooch

      - name: GPU frames
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if ('${{ matrix.image }}' -eq 'windows-2025') { $env:SCOOCH_NEED_ADAPTER = '1' }
          New-Item -ItemType Directory -Force winprobe | Out-Null
          cargo test --release -p scooch-live -- --nocapture --test-threads 1 2>&1 | Tee-Object -FilePath winprobe/gpu.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Probe
        if: ${{ !cancelled() }}
        continue-on-error: false
        shell: pwsh
        run: ./target/release/examples/winprobe.exe winprobe

      - name: Sizes
        if: ${{ !cancelled() && matrix.image == 'windows-2025' }}
        shell: pwsh
        run: |
          git fetch --depth 1 origin b6c02dc2fc0ee9da7a21132884e65f869f39375b
          git worktree add ../base b6c02dc2fc0ee9da7a21132884e65f869f39375b
          $started = Get-Date
          cargo build --release -p scooch --bins --manifest-path ../base/Cargo.toml --target-dir ../base-target
          $took = [int]((Get-Date) - $started).TotalSeconds
          New-Item -ItemType Directory -Force winprobe | Out-Null
          $lines = @("## Program sizes", "", "| program | before b6c02dc | after |", "|---|---|---|")
          foreach ($name in @("scooch.exe", "scoochw.exe")) {
            $before = (Get-Item "../base-target/release/$name").Length
            $after = (Get-Item "target/release/$name").Length
            $lines += "| $name | $before | $after |"
          }
          $lines += ""
          $lines += "- base release build of the programs from a cold target folder took $took s"
          $lines | Set-Content winprobe/sizes.md
          $lines | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: winprobe-${{ matrix.image }}
          path: winprobe
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (Test-Path winprobe/report.md) {
            Get-Content winprobe/report.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
