name: macos

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p scooch --bins --examples

      - name: Test
        run: cargo test --release -p scooch

      - name: Probe
        if: ${{ !cancelled() }}
        run: ./target/release/examples/macprobe macprobe

      - name: GPU bench
        if: ${{ !cancelled() }}
        run: ./target/release/examples/macprobe gpu-bench macprobe/bench

      - name: Cold start
        if: ${{ !cancelled() }}
        run: ./target/release/examples/macprobe cold-start macprobe/cold

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macprobe-${{ matrix.runner }}
          path: macprobe
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f macprobe/report.md ]; then
            cat macprobe/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f macprobe/cold/report.md ]; then
            cat macprobe/cold/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
