name: macos

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p scooch --bins --examples

      - name: Slides
        timeout-minutes: 45
        env:
          SCOOCH_PROBE_FOCUS: slides
        run: ./target/release/examples/macprobe macprobe

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macprobe-${{ matrix.runner }}
          path: macprobe
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f macprobe/report.md ]; then
            cat macprobe/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
