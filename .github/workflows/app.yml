name: app

on:
  push:
    branches: [main, app]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "site/src/styles/tokens.css"
      - "site/src/components/ui/**"
      - "site/scripts/make-brand.mjs"
      - ".github/workflows/app.yml"
      - ".github/actions/app-build/**"
      - ".github/app/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signing names stay in signing steps
        run: bash .github/app/secrets-check.sh

  build-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-build
        with:
          name: macos
          target: universal-apple-darwin
          bundles: app,dmg
          updater-pubkey: ${{ vars.TAURI_UPDATER_PUBKEY }}
      - name: Sign for macOS
        working-directory: crates/scooch-app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate, so the app keeps its ad hoc signature."
            exit 0
          fi
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_PRIVATE_KEY
          for name in APPLE_API_ISSUER APPLE_API_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          signed=no
          for attempt in 1 2 3; do
            if node ui/node_modules/@tauri-apps/cli/tauri.js bundle --ci --target universal-apple-darwin --bundles app,dmg $TAURI_ARGS; then
              signed=yes
              break
            fi
            sleep 15
          done
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          [ "$signed" = yes ]
      - name: Updater signatures
        shell: bash
        working-directory: crates/scooch-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash ../../.github/app/updater-sign.sh universal-apple-darwin
      - uses: ./.github/actions/app-collect
        with:
          name: macos
          target: universal-apple-darwin

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            target: x86_64-pc-windows-msvc
            clippy: "true"
          - name: windows-arm64
            target: aarch64-pc-windows-msvc
            clippy: "false"
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-build
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          bundles: nsis
          clippy: ${{ matrix.clippy }}
          updater-pubkey: ${{ vars.TAURI_UPDATER_PUBKEY }}
      - name: Sign for Windows
        shell: bash
        working-directory: crates/scooch-app
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            echo "No Windows certificate, so the installer stays unsigned."
            exit 0
          fi
          node ui/node_modules/@tauri-apps/cli/tauri.js bundle --ci --target ${{ matrix.target }} --bundles nsis $TAURI_ARGS
      - name: Updater signatures
        shell: bash
        working-directory: crates/scooch-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash ../../.github/app/updater-sign.sh ${{ matrix.target }}
      - uses: ./.github/actions/app-collect
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/app-build
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          bundles: deb,rpm,appimage
          updater-pubkey: ${{ vars.TAURI_UPDATER_PUBKEY }}
      - name: Updater signatures
        shell: bash
        working-directory: crates/scooch-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash ../../.github/app/updater-sign.sh ${{ matrix.target }}
      - uses: ./.github/actions/app-collect
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}

  files:
    needs: [secrets, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: built
      - name: Release names
        run: |
          mkdir -p release
          take() {
            found=$(find built -type f -name "$1" | head -1)
            if [ -z "$found" ]; then
              echo "No build output matches $1 for $2."
              exit 1
            fi
            cp "$found" "release/$2"
          }
          take '*_universal.dmg' Scooch.dmg
          take '*_x64-setup.exe' Scooch-Setup-x64.exe
          take '*_arm64-setup.exe' Scooch-Setup-arm64.exe
          take '*_amd64.deb' scooch_amd64.deb
          take '*_arm64.deb' scooch_arm64.deb
          take '*.x86_64.rpm' scooch.x86_64.rpm
          take '*.aarch64.rpm' scooch.aarch64.rpm
          take '*_amd64.AppImage' Scooch-x86_64.AppImage
          take '*_aarch64.AppImage' Scooch-aarch64.AppImage
          {
            echo "## Release files"
            echo
            echo "| file | bytes |"
            echo "|---|---|"
            for file in release/*; do
              echo "| $(basename "$file") | $(wc -c < "$file" | tr -d ' ') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release
          if-no-files-found: error

  probe-macos:
    needs: build-macos
    if: ${{ github.workflow == 'app' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-macos
          path: built
      - name: Probe
        timeout-minutes: 20
        run: bash .github/app/probe-macos.sh built appprobe
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appprobe-${{ matrix.runner }}
          path: appprobe
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: cat appprobe/report.md >> "$GITHUB_STEP_SUMMARY" || true

  probe-windows:
    needs: build-windows
    if: ${{ github.workflow == 'app' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: programs-${{ matrix.name }}
          path: programs
      - name: Probe
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/app/probe-windows.ps1 -Built built -Out appprobe -Programs programs
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appprobe-${{ matrix.name }}
          path: appprobe
          if-no-files-found: warn
      - name: Summary
        if: always()
        shell: bash
        run: cat appprobe/report.md >> "$GITHUB_STEP_SUMMARY" || true

  probe-linux:
    needs: build-linux
    if: ${{ github.workflow == 'app' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: built
      - name: Probe
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool imagemagick xfdesktop4 xfwm4 xfce4-panel xfconf xfce4-settings xfdesktop4-data gvfs gvfs-daemons dbus-x11 libglib2.0-bin file gnome-themes-extra
          sudo apt-get install -y ./built/*.deb
          XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_RUNTIME_DIR
          dbus-run-session -- bash .github/linux/xfce.sh .github/app/probe-linux.sh appprobe
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appprobe-${{ matrix.name }}
          path: appprobe
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: cat appprobe/report.md >> "$GITHUB_STEP_SUMMARY" || true

  rpm-fedora:
    needs: build-linux
    if: ${{ github.workflow == 'app' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: built
      - name: Install, answer and remove
        run: |
          mkdir -p appprobe
          report=appprobe/report.md
          rpm=$(ls built/*.rpm | head -1)
          name=$(rpm -qp --qf '%{NAME}' "$rpm")
          echo "## rpm on $(. /etc/os-release && echo "$PRETTY_NAME")" > "$report"
          echo >> "$report"
          echo "- file $(basename "$rpm"), package $name" >> "$report"
          dnf install -y "$rpm" > appprobe/install.log 2>&1
          echo "- dnf install exit $?, pulled $(grep -c '^ ' appprobe/install.log) lines of packages" >> "$report"
          echo "- scooch --version answers $(scooch --version 2>&1)" >> "$report"
          missing=$(ldd /usr/bin/scooch-app | grep 'not found' || true)
          echo "- ldd on scooch-app misses ${missing:-nothing}" >> "$report"
          dnf remove -y "$name" > appprobe/remove.log 2>&1
          removed=$?
          echo "- dnf remove exit $removed, files left $(rpm -q "$name" >/dev/null 2>&1 && echo yes || echo no)" >> "$report"
          cat "$report"
          scooch_left=$(command -v scooch || true)
          if [ -n "$missing" ] || [ "$removed" != 0 ] || [ -n "$scooch_left" ]; then exit 1; fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appprobe-rpm-${{ matrix.name }}
          path: appprobe
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: cat appprobe/report.md >> "$GITHUB_STEP_SUMMARY" || true
