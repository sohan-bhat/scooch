name: guard

on:
  push:
    paths:
      - ".github/**"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Signing names stay in their jobs
        run: bash .github/app/guard.sh
