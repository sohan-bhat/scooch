name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "No tag, so there is no version to compare."
            exit 0
          fi
          want="${TAG#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "The tag says $want and Cargo.toml says $have."
            exit 1
          fi

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: cargo build --release -p scooch --bin scooch --target aarch64-apple-darwin
      - run: cargo build --release -p scooch --bin scooch --target x86_64-apple-darwin
      - run: |
          mkdir out
          lipo -create -output out/scooch target/aarch64-apple-darwin/release/scooch target/x86_64-apple-darwin/release/scooch
          codesign --force --sign - --identifier me.sohanbhat.scooch out/scooch
          tar -czf scooch-macos.tar.gz -C out scooch
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: scooch-macos.tar.gz

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    needs: version
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: cargo build --release -p scooch --bin scooch --target ${{ matrix.arch }}-unknown-linux-musl
      - run: tar -czf scooch-linux-${{ matrix.arch }}.tar.gz -C target/${{ matrix.arch }}-unknown-linux-musl/release scooch
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: scooch-linux-${{ matrix.arch }}.tar.gz

  windows:
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    needs: version
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-pc-windows-msvc
      - run: cargo build --release -p scooch --bins --target ${{ matrix.arch }}-pc-windows-msvc
      - shell: pwsh
        run: |
          $from = "target/${{ matrix.arch }}-pc-windows-msvc/release"
          Compress-Archive -Path "$from/scooch.exe", "$from/scoochw.exe" -DestinationPath "scooch-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: scooch-windows-${{ matrix.arch }}.zip

  app:
    needs: version
    uses: ./.github/workflows/app.yml
    secrets: inherit

  publish:
    needs: [macos, linux, windows, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Sums
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
      - name: Sums check
        working-directory: dist
        shell: bash
        run: |
          if grep -q ' SHA256SUMS$' SHA256SUMS; then
            echo "The sums list themselves."
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          for asset in scooch-macos.tar.gz scooch-linux-x86_64.tar.gz scooch-linux-aarch64.tar.gz; do
            want=$(grep " $asset\$" SHA256SUMS | cut -d' ' -f1 || true)
            got=$(sha256sum "$asset" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "install.sh would not find a matching line for $asset."
              exit 1
            fi
            echo "install.sh finds $asset"
          done
          for asset in scooch-windows-x86_64.zip scooch-windows-aarch64.zip; do
            pwsh -NoProfile -Command "\$sums = Get-Content SHA256SUMS; \$line = \$sums | Where-Object { \$_ -match (' ' + [Regex]::Escape('$asset') + '\$') } | Select-Object -First 1; \$want = (\$line -split '\\s+')[0].ToLower(); \$got = (Get-FileHash -Algorithm SHA256 -Path '$asset').Hash.ToLower(); if (-not \$line -or \$want -ne \$got) { Write-Error 'install.ps1 would not find a matching line for $asset'; exit 1 }; 'install.ps1 finds $asset'"
          done
          cat SHA256SUMS
      - name: Preview
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: dist
      - name: Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "Scooch ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --title "Scooch ${TAG#v}" --generate-notes
          fi

  install-check:
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/install-check.yml
