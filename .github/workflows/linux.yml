name: linux

on:
  push:
    paths:
      - "crates/**"
      - ".github/workflows/linux.yml"
      - ".github/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: gnome
            kind: memory
            way: rename
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: gnome
            kind: memory
            way: writes
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: cinnamon
            kind: cinnamon
            way: part-1
            packages: xvfb x11-utils cinnamon cinnamon-settings-daemon nemo gvfs gvfs-daemons libglib2.0-bin python3-gi
            extras: cinnamon-desktop-data gdb
          - desktop: cinnamon
            kind: cinnamon
            way: part-2
            packages: xvfb x11-utils cinnamon cinnamon-settings-daemon nemo gvfs gvfs-daemons libglib2.0-bin python3-gi
            extras: cinnamon-desktop-data gdb
          - desktop: cinnamon
            kind: cinnamon
            way: part-3
            packages: xvfb x11-utils cinnamon cinnamon-settings-daemon nemo gvfs gvfs-daemons libglib2.0-bin python3-gi
            extras: cinnamon-desktop-data gdb
          - desktop: cinnamon
            kind: cinnamon
            way: part-4
            packages: xvfb x11-utils cinnamon cinnamon-settings-daemon nemo gvfs gvfs-daemons libglib2.0-bin python3-gi
            extras: cinnamon-desktop-data gdb
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package list
        id: list
        env:
          LIST: ${{ matrix.packages }} ${{ matrix.extras }} ${{ hashFiles('.github/linux/apt.sh') }}
        run: |
          prefix="apt-$ImageOS-$(printf '%s' "$LIST" | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%G%V)" >> "$GITHUB_OUTPUT"

      - name: Package cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /var/tmp/apt-archives
          key: ${{ steps.list.outputs.key }}
          restore-keys: ${{ steps.list.outputs.prefix }}

      - name: Packages
        id: apt
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        env:
          PACKAGES: ${{ matrix.packages }}
          EXTRAS: ${{ matrix.extras }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          on_retry_command: sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          command: sudo timeout -k 20s 8m env PACKAGES="$PACKAGES" EXTRAS="$EXTRAS" bash .github/linux/apt.sh /var/tmp/apt-archives

      - name: Run
        timeout-minutes: 95
        env:
          KIND: ${{ matrix.kind }}
          WAY: ${{ matrix.way }}
        run: |
          mkdir -p linuxprobe
          runtime="$(mktemp -d)"
          chmod 700 "$runtime"
          if [ "$KIND" = memory ]; then
            XDG_RUNTIME_DIR="$runtime" SCOOCH_MEMORY_WAY="$WAY" dbus-run-session -- bash .github/linux/gnome.sh "$PWD/.github/linux/x-memory.sh" linuxprobe || true
            cat linuxprobe/memory.txt
          else
            XDG_RUNTIME_DIR="$runtime" SCOOCH_SETS_LEFT=2500 dbus-run-session -- bash .github/linux/cinnamon.sh "$PWD/.github/linux/x-cinnamon.sh" linuxprobe || true
            cat linuxprobe/writes.txt
          fi

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.kind }}-${{ matrix.way }}
          path: linuxprobe
          if-no-files-found: warn

  other:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Packages
        run: |
          docker run --name packages -v "$PWD:/work" -w /work fedora:latest bash .github/linux/x-shell51.sh install
          docker commit packages other:local
          docker rm packages

      - name: Session
        timeout-minutes: 40
        run: |
          docker run --rm --init --cap-add SYS_NICE -v "$PWD:/work" -w /work -e HOST_UID="$(id -u)" -e COUNT=100 other:local bash .github/linux/x-shell51.sh run
          cat linuxprobe/replace.txt linuxprobe/readiness.txt || true

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: experiment-shell51
          path: linuxprobe
          if-no-files-found: warn
