name: linux

on:
  push:
    paths:
      - "crates/**"
      - ".github/workflows/linux.yml"
      - ".github/linux/**"
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: gnome
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: kde
            packages: xvfb x11-utils plasma-desktop plasma-workspace kwin-x11
            extras: kde-cli-tools plasma-workspace-wallpapers breeze-icon-theme
          - desktop: xfce
            packages: xvfb x11-utils xfdesktop4 xfwm4 xfce4-panel xfconf
            extras: xfce4-settings xfdesktop4-data gvfs gvfs-daemons
          - desktop: xfce-scale2
            script: xfce
            scale: 2
            packages: xvfb x11-utils xfdesktop4 xfwm4 xfce4-panel xfconf xfce4-settings
            extras: xfdesktop4-data gvfs gvfs-daemons
          - desktop: cinnamon
            packages: xvfb x11-utils cinnamon cinnamon-settings-daemon nemo gvfs gvfs-daemons libglib2.0-bin python3-gi
            extras: cinnamon-desktop-data
          - desktop: mate
            packages: xvfb x11-utils caja marco mate-panel gvfs gvfs-daemons libglib2.0-bin
            extras: mate-desktop-environment-core mate-backgrounds
          - desktop: xfce-dual
            script: xfce
            monitors: 2
            packages: xvfb x11-utils x11-xserver-utils xfdesktop4 xfwm4 xfce4-panel xfconf
            extras: xfce4-settings xfdesktop4-data gvfs gvfs-daemons
          - desktop: kde-dual
            script: kde
            monitors: 2
            packages: xvfb x11-utils x11-xserver-utils plasma-desktop plasma-workspace kwin-x11
            extras: kde-cli-tools plasma-workspace-wallpapers breeze-icon-theme
          - desktop: gnome-dual
            script: gnome
            monitors: 2
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: mate-dual
            script: mate
            monitors: 2
            packages: xvfb x11-utils x11-xserver-utils caja marco mate-panel gvfs gvfs-daemons libglib2.0-bin
            extras: mate-desktop-environment-core mate-backgrounds
          - desktop: kde-arch
            script: kde-wayland
            container: archlinux:latest
            packages: plasma-desktop plasma-workspace kwin breeze-icons
            extras: plasma-workspace-wallpapers
          - desktop: kde-arch-dual
            script: kde-wayland
            container: archlinux:latest
            monitors: 2
            packages: plasma-desktop plasma-workspace kwin breeze-icons
            extras: plasma-workspace-wallpapers
          - desktop: kde-debian
            script: kde
            container: debian:testing
            packages: plasma-desktop plasma-workspace kwin-x11 breeze-icon-theme
            extras: plasma-workspace-wallpapers kio-extras
          - desktop: kde-debian-dual
            script: kde
            container: debian:testing
            monitors: 2
            packages: plasma-desktop plasma-workspace kwin-x11 breeze-icon-theme
            extras: plasma-workspace-wallpapers kio-extras
          - desktop: xfce-arch
            script: xfce
            container: archlinux:latest
            packages: xfdesktop xfwm4 xfce4-panel xfconf xfce4-settings
            extras: adwaita-icon-theme
          - desktop: xfce-arch-dual
            script: xfce
            container: archlinux:latest
            monitors: 2
            packages: xfdesktop xfwm4 xfce4-panel xfconf xfce4-settings
            extras: adwaita-icon-theme
          - desktop: cinnamon-arch
            script: cinnamon
            container: archlinux:latest
            packages: cinnamon nemo python-gobject
            extras: cinnamon-translations
          - desktop: mate-arch
            script: mate
            container: archlinux:latest
            packages: caja marco mate-panel mate-desktop
            extras: mate-backgrounds mate-icon-theme
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Packages
        if: ${{ !matrix.container }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus dbus-x11 dbus-user-session xdg-user-dirs procps
          sudo apt-get install -y ${{ matrix.packages }}
          for extra in ${{ matrix.extras }}; do
            sudo apt-get install -y --no-install-recommends "$extra" || echo "skipped $extra"
          done

      - name: Build
        run: cargo build --release -p scooch --bins --examples

      - name: Test
        if: ${{ !matrix.container }}
        run: cargo test --release -p scooch

      - name: Probe
        if: ${{ !cancelled() }}
        env:
          SCOOCH_SCALE: ${{ matrix.scale || 1 }}
          SCOOCH_MONITORS: ${{ matrix.monitors || 1 }}
          PACKAGES: ${{ matrix.packages }}
          EXTRAS: ${{ matrix.extras }}
          IMAGE: ${{ matrix.container }}
          SCRIPT: ${{ matrix.script || matrix.desktop }}
        run: |
          if [ -n "$IMAGE" ]; then
            docker run --rm -v "$PWD:/work" -w /work -e SCOOCH_SCALE -e SCOOCH_MONITORS -e PACKAGES -e EXTRAS -e HOST_UID="$(id -u)" "$IMAGE" bash .github/linux/container.sh "$SCRIPT"
          else
            XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            export XDG_RUNTIME_DIR
            dbus-run-session -- bash ".github/linux/$SCRIPT.sh" ./target/release/examples/linuxprobe linuxprobe
          fi

      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linuxprobe-${{ matrix.desktop }}
          path: linuxprobe
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f linuxprobe/report.md ]; then
            cat linuxprobe/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
