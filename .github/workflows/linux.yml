name: linux

on:
  push:
    paths:
      - "crates/**"
      - ".github/workflows/linux.yml"
      - ".github/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  other:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "fedora:latest"]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Packages
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --name packages -v "$PWD:/work" -w /work "$IMAGE" bash .github/linux/other.sh install
          docker commit packages other:local
          docker rm packages

      - name: Session
        timeout-minutes: 130
        run: docker run --rm --init --cap-add SYS_NICE -v "$PWD:/work" -w /work -e HOST_UID="$(id -u)" -e SETS=1 -e SCOOCH_REPLACES=100 other:local bash .github/linux/other.sh run

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: other-${{ strategy.job-index }}
          path: linuxprobe
          if-no-files-found: warn
