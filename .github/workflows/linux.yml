name: linux

on:
  push:
    paths:
      - "crates/**"
      - ".github/workflows/linux.yml"
      - ".github/linux/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - desktop: gnome
            runner: ubuntu-24.04
            more: 300
            sections: ""
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: gnome-dual
            script: gnome
            monitors: 2
            runner: ubuntu-24.04
            more: 300
            sections: ""
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-shell-extension-prefs gnome-backgrounds ubuntu-wallpapers fonts-cantarell adwaita-icon-theme dconf-cli
          - desktop: gnome-42
            script: gnome
            runner: ubuntu-22.04
            more: 0
            sections: "1,2,6b,8"
            packages: gnome-shell gnome-shell-extension-desktop-icons-ng gvfs gvfs-daemons dconf-service libglib2.0-bin
            extras: gnome-backgrounds fonts-cantarell adwaita-icon-theme dconf-cli
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Package list
        id: list
        env:
          LIST: ${{ matrix.packages }} ${{ matrix.extras }} ${{ hashFiles('.github/linux/apt.sh') }}
        run: |
          prefix="apt-$ImageOS-$(printf '%s' "$LIST" | sha256sum | cut -c1-16)-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=$prefix$(date -u +%G%V)" >> "$GITHUB_OUTPUT"

      - name: Package cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /var/tmp/apt-archives
          key: ${{ steps.list.outputs.key }}
          restore-keys: ${{ steps.list.outputs.prefix }}

      - name: Packages
        id: apt
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        env:
          PACKAGES: ${{ matrix.packages }}
          EXTRAS: ${{ matrix.extras }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          on_retry_command: sudo env DEBIAN_FRONTEND=noninteractive dpkg --configure -a
          command: sudo timeout -k 20s 8m env PACKAGES="$PACKAGES" EXTRAS="$EXTRAS" bash .github/linux/apt.sh /var/tmp/apt-archives

      - name: Versions
        run: dpkg-query -W -f '${Package} ${Version}\n' gnome-shell mutter-common gnome-shell-extension-desktop-icons-ng libglib2.0-0t64 libglib2.0-0 dconf-service gjs 2>/dev/null | tee versions.txt || true

      - name: Build
        run: cargo build --release -p scooch --bins --examples

      - name: Probe
        timeout-minutes: 90
        env:
          SCOOCH_MONITORS: ${{ matrix.monitors || 1 }}
          SCOOCH_PROBE_MORE: ${{ matrix.more }}
          SCOOCH_PROBE_SECTIONS: ${{ matrix.sections }}
          SCRIPT: ${{ matrix.script || matrix.desktop }}
        run: |
          mkdir -p linuxprobe
          cp versions.txt linuxprobe/ || true
          bash .github/linux/tries.sh "$SCRIPT"

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: linuxprobe-${{ matrix.desktop }}
          path: linuxprobe
          if-no-files-found: warn

  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Mutants
        run: python3 .github/linux/x-mutants.py 2>&1 | tee mutants.txt

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants
          path: mutants.txt

  other:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Packages
        run: |
          docker run --name packages -v "$PWD:/work" -w /work fedora:latest bash .github/linux/x-shell51.sh install
          docker commit packages other:local
          docker rm packages

      - name: Session
        timeout-minutes: 40
        run: |
          docker run --rm --init --cap-add SYS_NICE -v "$PWD:/work" -w /work -e HOST_UID="$(id -u)" -e COUNT=100 other:local bash .github/linux/x-shell51.sh run
          cat linuxprobe/replace.txt linuxprobe/readiness.txt || true

      - name: Upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: experiment-shell51
          path: linuxprobe
          if-no-files-found: warn
