name: Build the Scooch app
description: Builds the scooch programs, checks the window and shell, and makes the installers for one target.

inputs:
  name:
    description: Name of the artifact suffix
    required: true
  target:
    description: Rust target the app is built for
    required: true
  bundles:
    description: Tauri bundles to make
    required: true
  clippy:
    description: Whether to run clippy on the shell
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Same version as the workspace
      shell: bash
      run: |
        want=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
        have=$(grep -m1 '^version' crates/scooch-app/Cargo.toml | cut -d'"' -f2)
        if [ "$want" != "$have" ]; then
          echo "The workspace says $want and the app says $have."
          exit 1
        fi

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || inputs.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.name }}
        workspaces: |
          . -> target
          crates/scooch-app -> target

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: crates/scooch-app/ui/package-lock.json

    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf file

    - name: Scooch program for macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cargo build --release -p scooch --bin scooch --target aarch64-apple-darwin
        cargo build --release -p scooch --bin scooch --target x86_64-apple-darwin
        mkdir -p crates/scooch-app/binaries
        lipo -create -output crates/scooch-app/binaries/scooch-universal-apple-darwin target/aarch64-apple-darwin/release/scooch target/x86_64-apple-darwin/release/scooch
        cp crates/scooch-app/binaries/scooch-universal-apple-darwin crates/scooch-app/binaries/scooch-aarch64-apple-darwin
        cp crates/scooch-app/binaries/scooch-universal-apple-darwin crates/scooch-app/binaries/scooch-x86_64-apple-darwin

    - name: Scooch programs for Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        RUSTFLAGS: -C target-feature=+crt-static
      run: |
        cargo build --release -p scooch --bins --target ${{ inputs.target }}
        New-Item -ItemType Directory -Force crates/scooch-app/binaries | Out-Null
        foreach ($name in 'scooch', 'scoochw') {
          Copy-Item "target/${{ inputs.target }}/release/$name.exe" "crates/scooch-app/binaries/$name-${{ inputs.target }}.exe"
        }

    - name: Scooch program for Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cargo build --release -p scooch --bin scooch --target ${{ inputs.target }}
        mkdir -p crates/scooch-app/binaries
        cp "target/${{ inputs.target }}/release/scooch" "crates/scooch-app/binaries/scooch-${{ inputs.target }}"

    - name: Window packages
      shell: bash
      working-directory: crates/scooch-app/ui
      run: npm ci

    - name: Window check
      shell: bash
      working-directory: crates/scooch-app/ui
      run: npm run typecheck

    - name: Shell clippy
      if: inputs.clippy == 'true'
      shell: bash
      working-directory: crates/scooch-app
      run: |
        npm --prefix ui run build
        cargo clippy --all-targets -- -D warnings

    - name: Updater switch
      id: updater
      shell: bash
      run: |
        if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_UPDATER_PUBKEY:-}" ]; then
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["https://github.com/sohan-bhat/scooch/releases/latest/download/latest.json"]}}}' "$TAURI_UPDATER_PUBKEY" > crates/scooch-app/updater.conf.json
          echo "args=--features updater --config updater.conf.json" >> "$GITHUB_OUTPUT"
        else
          echo "args=" >> "$GITHUB_OUTPUT"
        fi

    - name: Installers
      shell: bash
      working-directory: crates/scooch-app
      env:
        TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      run: |
        if [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
        fi
        unset APPLE_API_PRIVATE_KEY
        for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
          if [ -z "${!name:-}" ]; then unset "$name"; fi
        done
        node ui/node_modules/@tauri-apps/cli/tauri.js build --ci --target ${{ inputs.target }} --bundles ${{ inputs.bundles }} ${{ steps.updater.outputs.args }}

    - name: Collect
      shell: bash
      run: |
        mkdir -p dist
        bundle="crates/scooch-app/target/${{ inputs.target }}/release/bundle"
        find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
        {
          echo "## ${{ inputs.name }}"
          echo
          echo "| file | bytes |"
          echo "|---|---|"
          for file in dist/*; do
            echo "| $(basename "$file") | $(wc -c < "$file" | tr -d ' ') |"
          done
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@v4
      with:
        name: app-${{ inputs.name }}
        path: dist
        if-no-files-found: error

    - name: Programs for the probe
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: programs-${{ inputs.name }}
        path: crates/scooch-app/binaries
        if-no-files-found: error
